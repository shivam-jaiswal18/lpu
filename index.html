<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101126">
    <title>Welcome back | Sign in</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #101126;
            color: #f7f7ff;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            padding: 24px;
            background: radial-gradient(ellipse at 15% 15%, #29235a 0, transparent 38%),
                        radial-gradient(ellipse at 85% 85%, #173e50 0, transparent 36%), #101126;
        }

        .orb {
            position: fixed;
            z-index: 0;
            width: 260px;
            aspect-ratio: 1;
            border-radius: 50%;
            filter: blur(1px);
            opacity: .6;
            pointer-events: none;
            animation: float 9s ease-in-out infinite;
        }

        .orb-one { top: -105px; right: 12%; background: linear-gradient(135deg, #a855f7, #5b5de6); }
        .orb-two { bottom: -140px; left: 8%; width: 330px; background: linear-gradient(135deg, #15c6b5, #386be8); animation-delay: -4s; }

        .login-card {
            position: relative;
            z-index: 1;
            width: min(100%, 440px);
            padding: 44px;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 24px;
            background: rgba(21, 22, 45, .76);
            box-shadow: 0 24px 80px rgba(0, 0, 0, .38), inset 0 1px rgba(255, 255, 255, .08);
            backdrop-filter: blur(18px);
            animation: arrive .75s cubic-bezier(.2, .8, .2, 1) both;
        }

        .brand-mark {
            display: grid;
            width: 48px;
            height: 48px;
            place-items: center;
            margin-bottom: 28px;
            border-radius: 15px;
            color: white;
            font-size: 22px;
            background: linear-gradient(135deg, #a855f7, #6366f1 60%, #22d3c5);
            box-shadow: 0 8px 24px rgba(119, 91, 245, .35);
        }

        h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.15rem); letter-spacing: -.045em; }
        .intro { margin: 9px 0 30px; color: #a8abc6; font-size: .96rem; }

        .field { margin-bottom: 19px; }
        label { display: block; margin-bottom: 9px; color: #e5e6f2; font-size: .86rem; font-weight: 600; }

        .input-wrap { position: relative; }
        input {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            border: 1px solid rgba(207, 211, 245, .16);
            border-radius: 12px;
            outline: none;
            color: #fff;
            background: rgba(8, 10, 27, .46);
            font: inherit;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }

        input::placeholder { color: #737791; }
        input:focus { border-color: #9b7bff; background: rgba(8, 10, 27, .72); box-shadow: 0 0 0 4px rgba(139, 103, 255, .14); }
        .password-input { padding-right: 68px; }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 13px;
            padding: 5px;
            transform: translateY(-50%);
            border: 0;
            color: #a9abc4;
            background: transparent;
            font: inherit;
            font-size: .78rem;
            cursor: pointer;
        }

        .toggle-password:hover { color: #fff; }
        .form-options { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 5px 0 25px; font-size: .82rem; }
        .remember { display: flex; align-items: center; gap: 8px; color: #b3b5cc; cursor: pointer; }
        .remember input { width: 15px; height: 15px; margin: 0; accent-color: #9675ff; }
        a { color: #b7a3ff; text-decoration: none; }
        a:hover { color: #ddd2ff; text-decoration: underline; }

        .submit-button {
            width: 100%;
            height: 52px;
            border: 0;
            border-radius: 12px;
            color: white;
            background: linear-gradient(100deg, #8056ed, #6859e8 55%, #5378ed);
            box-shadow: 0 9px 24px rgba(105, 83, 231, .28);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: transform .2s, box-shadow .2s, filter .2s;
        }

        .submit-button:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 13px 30px rgba(105, 83, 231, .4); }
        .submit-button:active { transform: translateY(0); }
        .signup { margin: 25px 0 0; color: #a8abc6; text-align: center; font-size: .88rem; }

        @keyframes arrive { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes float { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(22px, 28px); } }

        @media (max-width: 480px) {
            body { padding: 18px; }
            .login-card { padding: 32px 25px; }
            .orb { width: 190px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
        }
    </style>
</head>
<body>
    <div class="orb orb-one" aria-hidden="true"></div>
    <div class="orb orb-two" aria-hidden="true"></div>

    <main class="login-card">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <h1>Welcome back</h1>
        <p class="intro">Sign in to continue to your account.</p>

        <form action="#" method="get">
            <div class="field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <input class="password-input" id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                    <button class="toggle-password" type="button" aria-controls="password" aria-pressed="false">Show</button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
                <a href="#forgot-password">Forgot password?</a>
            </div>

            <button class="submit-button" type="submit">Sign in</button>
        </form>

        <p class="signup">New here? <a href="#signup">Create an account</a></p>
    </main>

    <script>
        const passwordInput = document.querySelector('#password');
        const toggleButton = document.querySelector('.toggle-password');

        toggleButton.addEventListener('click', () => {
            const showingPassword = passwordInput.type === 'password';
            passwordInput.type = showingPassword ? 'text' : 'password';
            toggleButton.textContent = showingPassword ? 'Hide' : 'Show';
            toggleButton.setAttribute('aria-pressed', String(showingPassword));
        });
    </script>
</body>
</html>
