<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090916">
    <title>A Special Hello for Shivam</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --pink: #ff8ecb;
            --lavender: #b7a0ff;
            --cyan: #83e8ff;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            color: #fff;
            background: #090916;
        }

        .scene {
            position: relative;
            isolation: isolate;
            display: grid;
            min-height: 100vh;
            width: 100%;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 50% 110%, rgba(102, 54, 173, .35), transparent 55%),
                radial-gradient(ellipse at 12% 15%, rgba(37, 112, 151, .16), transparent 40%),
                #090916;
        }

        .scene::before, .scene::after {
            position: absolute;
            z-index: -1;
            width: min(75vw, 720px);
            aspect-ratio: 1;
            border: 1px solid rgba(193, 164, 255, .13);
            border-radius: 50%;
            content: "";
            animation: orbit 32s linear infinite;
        }

        .scene::after {
            width: min(58vw, 540px);
            border-color: rgba(131, 232, 255, .12);
            animation-duration: 24s;
            animation-direction: reverse;
        }

        .glow {
            position: absolute;
            z-index: -1;
            width: min(62vw, 600px);
            aspect-ratio: 1;
            border-radius: 50%;
            background: conic-gradient(from 30deg, transparent, rgba(255, 142, 203, .26), transparent 38%, rgba(131, 232, 255, .2), transparent 72%);
            filter: blur(70px);
            animation: breathe 8s ease-in-out infinite alternate;
        }

        .stars {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(1px 1px at 12% 28%, #fff 99%, transparent),
                radial-gradient(2px 2px at 83% 20%, #cbbcff 99%, transparent),
                radial-gradient(1px 1px at 72% 75%, #fff 99%, transparent),
                radial-gradient(2px 2px at 20% 82%, #85eaff 99%, transparent),
                radial-gradient(1px 1px at 91% 57%, #fff 99%, transparent),
                radial-gradient(1px 1px at 39% 12%, #ffacd8 99%, transparent);
            background-size: 100% 100%;
            animation: twinkle 4s ease-in-out infinite alternate;
        }

        main {
            width: min(90%, 760px);
            padding: clamp(2.5rem, 7vw, 5rem) 1.5rem;
            text-align: center;
            animation: arrive 1.2s cubic-bezier(.2,.8,.2,1) both;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: .65rem;
            margin: 0 0 1.8rem;
            color: #c8c1df;
            font-size: .72rem;
            font-weight: 600;
            letter-spacing: .28em;
            text-transform: uppercase;
            animation: fade-up .9s .25s both;
        }

        .eyebrow::before, .eyebrow::after {
            width: 24px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--pink));
            content: "";
        }
        .eyebrow::after { transform: rotate(180deg); }

        h1 {
            margin: 0;
            background: linear-gradient(110deg, #fff 12%, #ffb6df 42%, #c3b0ff 72%, #9cecff);
            background-clip: text;
            color: transparent;
            font-size: clamp(4rem, 15vw, 9.5rem);
            font-weight: 800;
            letter-spacing: .08em;
            line-height: 1;
            text-indent: .08em;
            filter: drop-shadow(0 0 28px rgba(202, 149, 255, .2));
            animation: name-glow 5s ease-in-out infinite alternate, fade-up 1s .4s both;
        }

        .rule {
            width: 76px;
            height: 2px;
            margin: 2rem auto 1.65rem;
            border-radius: 9px;
            background: linear-gradient(90deg, var(--cyan), var(--pink), var(--lavender));
            box-shadow: 0 0 18px rgba(255, 142, 203, .75);
            animation: widen 1s .75s both;
        }

        .message {
            margin: 0;
            color: #eeebf7;
            font-size: clamp(1.1rem, 3vw, 1.55rem);
            font-weight: 400;
            letter-spacing: .025em;
            animation: fade-up 1s .7s both;
        }

        .note {
            margin: 1rem 0 0;
            color: #a8a3bb;
            font-size: .95rem;
            letter-spacing: .03em;
            animation: fade-up 1s .9s both;
        }

        .sparkle {
            position: absolute;
            color: #fff0bb;
            font-size: 1.1rem;
            text-shadow: 0 0 16px #ffd887;
            animation: sparkle 2.6s ease-in-out infinite;
        }
        .sparkle.one { top: 25%; left: 23%; }
        .sparkle.two { top: 33%; right: 22%; animation-delay: .8s; font-size: .8rem; }
        .sparkle.three { bottom: 25%; left: 29%; animation-delay: 1.4s; font-size: .7rem; }

        @keyframes arrive { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes orbit { to { transform: rotate(360deg); } }
        @keyframes breathe { from { opacity: .45; transform: scale(.8) rotate(0); } to { opacity: .9; transform: scale(1.12) rotate(35deg); } }
        @keyframes twinkle { from { opacity: .42; } to { opacity: 1; } }
        @keyframes sparkle { 0%, 100% { opacity: .25; transform: scale(.7) rotate(0); } 50% { opacity: 1; transform: scale(1.25) rotate(18deg); } }
        @keyframes widen { from { opacity: 0; transform: scaleX(.2); } to { opacity: 1; transform: scaleX(1); } }
        @keyframes name-glow { from { filter: drop-shadow(0 0 18px rgba(202,149,255,.16)); } to { filter: drop-shadow(0 0 34px rgba(202,149,255,.4)); } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
        }
    </style>
</head>
<body>
    <div class="scene">
        <div class="stars" aria-hidden="true"></div>
        <div class="glow" aria-hidden="true"></div>
        <span class="sparkle one" aria-hidden="true">✦</span>
        <span class="sparkle two" aria-hidden="true">✧</span>
        <span class="sparkle three" aria-hidden="true">✦</span>
        <main>
            <p class="eyebrow">A little moment just for you</p>
            <h1>SHIVAM</h1>
            <div class="rule" aria-hidden="true"></div>
            <p class="message">Wishing you a day filled with joy, warmth, and wonderful surprises.</p>
            <p class="note">You deserve all the beautiful things life has to offer ✨</p>
        </main>
    </div>
</body>
</html>
